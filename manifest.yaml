# carbide2 release manifest — the single source of truth for the release version.
#
# Bumped by hand at release time. build.rb and deploy.rb read this and stamp
# `version` + `codename` into every container image as:
#   - an OCI label  (org.carbide.version / org.carbide.codename) — visible in the
#     registry's image manifest (config.Labels), and
#   - a runtime env (CARBIDE_VERSION / CARBIDE_CODENAME) — reported by
#     /api/v1/common/version.
#
# The component SHAs are the submodule gitlinks (and the image tags); they are
# not repeated here because they change every commit, whereas this file names a
# release.
version: 0.5.3-rc1
codename: ferrari
