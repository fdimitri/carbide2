# defaults.yaml — the single source of deploy.rb defaults.
#
# Every default lives here (no implicit defaults scattered through the Ruby).
# deploy.rb merges this with an optional --config input.yaml and then CLI flags
# (--a.b.c sets the a.b.c key). Emit the fully-resolved set with
#   ./scripts/deploy.rb --yaml-out cluster.yaml         (secrets included)
#   ./scripts/deploy.rb --yaml-safeout cluster.safe.yaml (secrets redacted)
# A "" value means "unset / auto-detect" for that optional knob.

# --- orchestration toggles ---------------------------------------------------
ref: main            # meta-repo branch/ref to check out + fast-forward before build
client: true         # build + upload the pinned SPA client to the MinIO static tier
infra: true          # bring the cluster + infra up
tls: true            # mkcert TLS setup for the ingress
pull: true           # self-update (git pull + submodule update) before deploying
roll-scope: all      # which deployments to roll after deploy: all | control | none

# One-shot cert actions (normally unset; set via CLI for a single run).
csr: false           # generate key + CSR, then exit
import-cert: ''       # path to a CA-signed cert to load as the Traefik default, then exit
key: ''               # private key for import-cert (default: the .key from --csr)

kubeconfig: '~/.kube/config'   # read by the verify step (kubeclient)

# --- what this box IS (ADR-028 §1–§2) ------------------------------------------
node:
  backend: k3d       # k3d (k3s-in-Docker, single node) | k3s (host-native) | none (no cluster here)
  role: ''           # k3s only: init (first server) | join (additional server) | agent (unimplemented).
                     # "" => init for k3s, none otherwise.

# --- what this box DOES with images (ADR-028 §1, §3) -----------------------------
images:
  build: true        # docker buildx the images
  shell: true        # include carbide2-shell in the build (slow, large)
  push: false        # push SHA-tagged images to registry.host (implies build)
  consume: auto      # how this box's OWN cluster gets images:
                     #   auto   => k3d / single-node k3s import :dev; k3s with a registry pulls SHA tags
                     #   import => k3d/k3s containerd import of the local :dev images
                     #   pull   => pull SHA tags from registry.host (k3d needs node trust; see Node)

# --- the image registry: a fact about the fleet (ADR-028 §1) --------------------
registry:
  host: ''           # endpoint every node pushes to / pulls from; "" => no registry anywhere
  port: '5000'
  ca: ''             # PEM a consumer trusts; "" => system trust store. Ignored (derived from
                     # mkcert) on the box that serves it; --yaml-out fills it in for the fleet.
  serve: false       # this box runs the registry:2 container

# --- the cluster: facts shared by every node in it -------------------------------
cluster:
  name: carbide-dev
  http-port: ''      # "" => backend default (k3d 8080 / k3s 80)
  https-port: ''     # "" => backend default (k3d 8443 / k3s 443)
  server-url: ''     # https://<first-node>:6443 — join: required; init: extra API-cert SAN
  token: ''          # k3s shared join secret; init mints one if blank. SECRET.

# --- control plane -----------------------------------------------------------
control:
  namespace: carbide-system
  release: carbide-control

# --- browser-facing endpoint -------------------------------------------------
public:
  host: ''           # browser FQDN for ingress/cert/host-auth ("" => hostname -f)
  url: ''            # explicit full URL base (wins over host)

# --- ingress TLS -------------------------------------------------------------
tls-opts:
  traefik-ns: traefik
  secret: carbide-tls
  hosts: ''          # space-separated SAN list ("" => auto-detect FQDN/short/IPs)
  out-dir: tls       # where --csr writes the key/CSR and --import-cert looks for the key

# --- JWT signing key (ADR-015 RS256) -----------------------------------------
jwt:
  namespace: ''      # control-plane namespace holding the signing-key secret ("" => control.namespace)
  secret: workspace-jwt  # Secret name the control chart mounts as JWT_SIGNING_KEY
  key-dir: '~/.carbide/jwt'  # host-side dir persisting the private key (never in cluster.yaml)

# --- persistent storage backend ----------------------------------------------
storage:
  backend: local-path   # local-path (node-local, single-node) | longhorn (replicated RWO, multi-node)
  longhorn:
    version: 1.7.2      # "" => chart latest
    replicas: ''        # "" => Longhorn default (3); set to node count on small clusters
